[package]
name = "carbon-tracker-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework (Rocket async)
rocket = { version = "0.5.0", features = ["json"] }

# Database & ORM (SQLx)
# Kita menggunakan runtime-tokio-rustls agar ringan dan aman
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "rust_decimal",
] }
redis = { version = "0.24", features = ["tokio-comp", "json"] }
deadpool-redis = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Auth & Hashing
jsonwebtoken = "9.2"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rust_decimal = { version = "1.41.0", features = ["serde-float"] }
rust_decimal_macros = "1.40.0"

# For API Integration
reqwest = { version = "0.11", features = ["json"] }

# For Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

#For Testing
[dev-dependencies]
mockall = "0.12"
wiremock = "0.6"
