[package]
name = "carbon-tracker-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework (Rocket async)
rocket = { version = "0.5.0", features = ["json"] }

# Database & ORM (SQLx)
# Kita menggunakan runtime-tokio-rustls agar ringan dan aman
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls", 
    "postgres", 
    "uuid", 
    "chrono", 
    "macros", 
    "rust_decimal"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Auth & Hashing
jsonwebtoken = "9.2"
argon2 = "0.5"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rust_decimal = { version = "1.41.0", features = ["serde-float"] }
rust_decimal_macros = "1.40.0"
